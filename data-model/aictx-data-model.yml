traversal_note: >-
  Every resource also carries a HAL-style `_links` block naming its relations by URL, and
  `?_embed` inflates those relations into an `_embedded` object in one round trip. That is the
  cheapest way to walk this graph; the id fields above are the fallback when a caller needs to
  join across snapshots.
acf_note: >-
  The substantive per-entity content (product copy, office addresses, job descriptions, partner
  detail) lives in the per-post-type Advanced Custom Fields `acf` object. Its shape is not
  declared in the route index or in the OPTIONS schema — both type it as a free-form object — so
  it is deliberately left untyped here rather than guessed at.
