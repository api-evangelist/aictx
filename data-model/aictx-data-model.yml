description: >-
  Entity-relationship graph of the SynSense Website Content API, derived from the component
  schemas (which were themselves read from the API's own HTTP OPTIONS JSON Schema) and from the
  relation fields each resource declares. WordPress models everything as either a post type (a
  content object with an integer id) or a taxonomy term (a classifier with an integer id, a slug,
  a parent and a count); the SynSense-specific entities are named below with the business object
  each one actually holds.
api: SynSense Website Content API
id_scheme:
  type: integer
  detail: >-
    Every entity is addressed by a bare auto-increment integer. There are no prefixed or typed
    ids, so an id is only meaningful together with its collection — 745 is SAMNA as a product and
    something unrelated as a post. Each resource also carries a human-stable `slug` and a
    canonical `link` URL, and slug is the safer join key across snapshots.
