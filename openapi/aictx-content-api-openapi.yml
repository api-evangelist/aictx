        description: Scope under which the request is made; determines fields present in response.
      - name: exclude
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
        description: Ensure result set excludes specific IDs.
        style: form
        explode: false
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
