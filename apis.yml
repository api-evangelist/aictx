aid: aictx
name: aiCTX (now SynSense)
description: >-
  aiCTX AG — renamed SynSense AG in May 2020 — is a neuromorphic computing company founded in
  Zurich in 2017 out of the Institute of Neuroinformatics at the University of Zurich and ETH
  Zurich. It designs ultra-low-power mixed-signal neuromorphic processors and smart sensors for
  always-on, sub-milliwatt edge inference: the Speck and DYNAP-CNN event-driven vision SoCs, the
  Xylo family for audio and IMU signal processing, and the DVS, Rigi and AEVEON sensor series.
  Its developer surface is a stack of open-source Python libraries rather than a product web API —
  Samna (the device interface and runtime), Rockpool (spiking network training and deployment)
  and Sinabs (PyTorch spiking CNNs) — backed by a developer community, forum, and firmware and
  datasheet download hub at synsense.ai. The one HTTP API the company serves publicly is the
  anonymous, read-only WordPress REST content API behind that corporate site, which exposes its
  products, partners, offices, awards, open roles and news as machine-readable JSON.
