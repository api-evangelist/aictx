apis:
- aid: aictx:website-content-api
  name: SynSense Website Content API
  description: >-
    The public WordPress REST API served at https://www.synsense.ai/wp-json. Fully anonymous and
    read-only for the content surface, it exposes SynSense's own custom post types as JSON —
    products, partner organisations, offices, awards, open roles and news — alongside the core
    WordPress content, taxonomy and discovery routes. This is the only HTTP API the company
    publishes; the neuromorphic hardware is programmed through the Samna/Rockpool/Sinabs Python
    libraries, not over the network.
