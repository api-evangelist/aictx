description: >-
  SynSense publishes no changelog for its website content API and no company-level API release
  notes. It does keep one real, dated, Keep-a-Changelog-style file: the Rockpool CHANGELOG, on the
  repo's default branch (develop) and rendered in the Rockpool docs at
  https://rockpool.ai/advanced/CHANGELOG.html. That is the provider's only dated release record
  and is what is captured here. Sinabs and Samna ship no CHANGELOG.md — the raw path 404s on
  main, develop and master for synsense/sinabs, and Samna is documented only per-version.
subject: rockpool
subject_note: >-
  This changelog covers the Rockpool SDK, NOT the HTTP API described in
  openapi/aictx-website-content-api-openapi.json. That API has no changelog at all.
