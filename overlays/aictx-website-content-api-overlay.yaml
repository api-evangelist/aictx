actions:
- target: $.info
  description: Attach provider identity and the aiCTX -> SynSense rename to the contract itself.
  update:
    x-provider: SynSense AG
    x-provider-former-name: aiCTX AG
    x-provider-renamed: '2020-05'
    x-provider-website: https://www.synsense.ai/
    x-provider-industry: Neuromorphic computing and edge AI silicon
    x-apievangelist-profile: https://apis.io/provider/aictx
- target: $.info
  description: >-
    State plainly that the product surface is not this API, so an agent reading only the contract
    does not conclude SynSense's hardware is network-callable.
  update:
    x-product-surface: >-
      SynSense's neuromorphic processors are programmed through local Python libraries (Samna,
      Rockpool, Sinabs) over USB/FPGA development kits. There is no network API for the silicon.
      This contract covers the corporate website's content only.
- target: $.servers[0]
  description: Record the observed transport posture of the single server.
  update:
    x-tls: TLSv1.3
    x-hsts-max-age: 31536000
    x-cors-allow-origin: '*'
    x-observed: '2026-09-14'
- target: $.paths[*].get
  description: >-
    Mark every described operation as safe and anonymous. The public surface answers `Allow: GET`
    and refuses anonymous writes with 401.
  update:
    x-safe: true
    x-auth-required: false
    x-agentic-access:
      action_class: read
      consequence: none
      token: none
      escalation: none
- target: $.components.schemas
  description: Cross-link the derived artifacts that explain this contract at runtime.
  update:
