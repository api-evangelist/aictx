description: >-
  First-party SynSense (formerly aiCTX) client libraries. SynSense ships no HTTP client SDK —
  the company's developer surface is a stack of Python libraries that drive its neuromorphic
  silicon over USB/FPGA dev kits. Every version and published date below was read from the
  registry metadata endpoint (https://pypi.org/pypi/<name>/json) on 2026-09-14; the registry's
  own upload_time_iso_8601 for the current release is the date recorded. No npm, Maven, NuGet,
  crates.io, RubyGems, Packagist or pkg.go.dev package is published under the SynSense or aiCTX
  name — the npm registry search for "synsense" returns zero results.
packages:
- language: python
  registry: pypi
  name: samna
  url: https://pypi.org/project/samna/
  source: https://synsense-sys-int.gitlab.io/samna/
  docs: https://synsense-sys-int.gitlab.io/samna/
  install: pip install samna
  official: true
  version: 0.48.6
  published: '2026-06-22'
  note: >-
    "SynSense Samna Public Package" — the developer interface and runtime for every SynSense
    device. Python API over a C++ core, with an event-stream filter graph and a JIT compiler for
    user-defined filters. Registry maintainer email is @synsense.ai, which is the first-party
    signal. This is the closest thing SynSense has to an API contract, and it is a local
    device-binding library, not a network interface.
